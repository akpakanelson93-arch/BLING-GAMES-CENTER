<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Downloads | Bling Game Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <img src="../assets/mockups/logo.png" alt="Bling Game Center logo" />
          </div>
          <div class="brand-copy">
            <span class="eyebrow">Arcade</span>
            <h1>Bling</h1>
          </div>
        </div>

        <nav class="nav">
          <a class="nav-item" href="../index.html"><span class="nav-icon">⌂</span> <span>Home</span></a>
          <a class="nav-item" href="./games.html"><span class="nav-icon">▣</span> <span>Games</span></a>
          <a class="nav-item" href="./trending.html"><span class="nav-icon">↗</span> <span>Trending</span></a>
          <a class="nav-item" href="./library.html"><span class="nav-icon">▤</span> <span>Library</span></a>
          <a class="nav-item active" href="./downloads.html"><span class="nav-icon">↓</span> <span>Downloads</span></a>
          <a class="nav-item" href="./profile.html"><span class="nav-icon">◉</span> <span>Profile</span></a>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input type="text" placeholder="Find downloads..." />
          </div>

          <div class="topbar-actions">
            <button class="theme-toggle" aria-label="Toggle theme">
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </button>
            <div class="avatar small">
              <img
                src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=200&q=80"
                alt="Profile avatar"
              />
            </div>
          </div>
        </header>

        <section class="page-header">
          <div>
            <span class="badge badge-purple">Storage</span>
            <h2>Downloads</h2>
          </div>
        </section>

        <section class="content-block">
          <div class="download-list">
            <div class="download-item">
              <div class="download-thumb thumb-5"></div>
              <div class="download-info">
                <strong>Pixel Legion</strong>
                <span>12.8 GB • 83% downloaded</span>
                <div class="progress"><span style="width: 83%"></span></div>
              </div>
              <button class="ghost-button small">Resume</button>
            </div>

            <div class="download-item">
              <div class="download-thumb thumb-6"></div>
              <div class="download-info">
                <strong>Forest Drift</strong>
                <span>8.4 GB • 100% complete</span>
                <div class="progress"><span style="width: 100%"></span></div>
              </div>
              <button class="ghost-button small">Play</button>
            </div>

            <div class="download-item">
              <div class="download-thumb thumb-7"></div>
              <div class="download-info">
                <strong>Shadow Dome</strong>
                <span>17.3 GB • 41% downloaded</span>
                <div class="progress"><span style="width: 41%"></span></div>
              </div>
              <button class="ghost-button small">Pause</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="../js/app.js"></script>
  </body>
</html>
